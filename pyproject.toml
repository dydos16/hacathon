[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-packer"
version = "0.1.0"
description = "Упаковщик научного Python-кода: делает проект воспроизводимым на другом компьютере"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.46", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repropack = "repropack.__main__:main"

[tool.setuptools]
packages = ["repropack"]

[tool.setuptools.package-data]
repropack = ["data/*.json", "data/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: ставит пакеты из PyPI (включается переменной REPRO_NETWORK_TESTS=1)"]
