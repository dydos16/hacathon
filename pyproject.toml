[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-packer"
version = "0.1.0"
description = "Упаковщик научного Python-кода: делает проект воспроизводимым на другом компьютере"
requires-python = ">=3.11"
# streamlit 1.66: загрузка папки, горизонтальные контейнеры, тема; проверяется в CI задачей «минимальные версии».
# jinja2 3.1.6: в 3.1.0–3.1.5 — CVE-2024-22195, -34064, -56201, -56326, CVE-2025-27516
# pandas: app.py импортирует его напрямую; раньше приходил только транзитивно через streamlit
dependencies = ["streamlit>=1.66", "jinja2>=3.1.6", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
e2e = ["playwright>=1.45"]  # tests/test_site.py: сайт в настоящем браузере

[project.scripts]
repropack = "repropack.__main__:main"

[tool.setuptools]
packages = ["repropack"]

[tool.setuptools.package-data]
repropack = ["data/*.json", "data/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: ставит пакеты из PyPI (включается переменной REPRO_NETWORK_TESTS=1)"]

# pytest --cov: строки и ветки repropack и интерфейса; меньше 100 % — ошибка
[tool.coverage.run]
branch = true
source = ["repropack", "app"]

[tool.coverage.report]
show_missing = true
fail_under = 100
