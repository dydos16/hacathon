[server]
# Совпадает с лимитом repropack.intake.MAX_ARCHIVE_BYTES
maxUploadSize = 20

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

# Светлая тема: на проекторе тёмная выцветает. Один акцент — тёмно-синий; красный в интерфейсе
# означает только «критично». Шрифты — встроенные в Streamlit (с кириллицей, работают без интернета).
[theme]
base = "light"
primaryColor = "#1f4f8f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1b2230"
linkColor = "#1f4f8f"
borderColor = "#d8dde5"
showWidgetBorder = true
baseRadius = "small"
dataframeHeaderBackgroundColor = "#f3f5f8"
# Код и пути — нейтральным цветом, а не зелёным по умолчанию: цвет в интерфейсе означает только уровень проблемы
codeTextColor = "#1b2230"
codeBackgroundColor = "#eef1f5"
