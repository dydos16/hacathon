[server]
# Только эта машина: без адреса Streamlit слушает все интерфейсы и отвечает соседям по сети.
# Показать с телефона или другого компьютера: streamlit run app.py --server.address 0.0.0.0
address = "127.0.0.1"
# Совпадает с лимитом repropack.intake.MAX_ARCHIVE_BYTES
maxUploadSize = 150

[client]
toolbarMode = "minimal"
# Ошибка показывается без трассировки: пути и код сервера посетителю не нужны (в терминале она видна полностью)
showErrorDetails = "none"

[browser]
gatherUsageStats = false

# Светлая тема «научный журнал»: на проекторе тёмная выцветает. Бумажный фон, чернильный текст, один акцент —
# петроль (#135f78, контраст 7:1 на белом); красный в интерфейсе означает только «критично».
# Шрифты — встроенные в Streamlit (с кириллицей, работают без интернета): заголовки с засечками, текст без.
# Анимации, карточки и иллюстрация первого экрана — в ui/style.css и ui/hero.svg.
[theme]
base = "light"
primaryColor = "#135f78"
backgroundColor = "#fbfaf6"
secondaryBackgroundColor = "#f3f0e8"
textColor = "#1d2330"
linkColor = "#135f78"
borderColor = "#e4ded1"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
dataframeHeaderBackgroundColor = "#f3f0e8"
# Код и пути — нейтральным цветом, а не зелёным по умолчанию: цвет в интерфейсе означает только уровень проблемы
codeTextColor = "#1d2330"
codeBackgroundColor = "#f1ede4"
