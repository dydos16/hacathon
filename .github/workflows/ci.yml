name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Тестам нужно только прочитать код: токен с правом записи им не выдаём
# Действия — по полному SHA коммита (тег можно перевесить на чужой код), uv — точной версией
permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      # Сквозной тест «пакет → чистый venv → запуск» с установкой numpy/pandas из PyPI
      REPRO_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Покрытие (fail_under = 100) считаем на одной конфигурации: на остальных часть веток для других ОС пропускается
      - run: python -m pytest -v ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && '--cov' || '' }}

  lowest:
    # Самые низкие версии, которые разрешает pyproject.toml: обещание «streamlit>=…» должно быть правдой
    name: tests · минимальные версии зависимостей · Python 3.11
    runs-on: ubuntu-latest
    env:
      REPRO_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.12.21
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: python -c "import streamlit, jinja2, pytest; print(streamlit.__version__, jinja2.__version__, pytest.__version__)"
      - run: python -m pytest -v

  docker:
    # Сгенерированный Dockerfile собирается, а проект в образе запускается (numpy/pandas и OpenCV с apt-get)
    name: Docker-образ пакета · ubuntu-latest
    runs-on: ubuntu-latest
    env:
      REPRO_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Базовый образ заранее и с повтором: сбой сети при скачивании с Docker Hub — не ошибка Dockerfile
      - run: for i in 1 2 3; do docker pull python:3.11-slim && break; sleep 15; done
      - run: python -m pytest tests/test_docker.py -v

  site:
    name: site in browser · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      REPRO_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,e2e]"
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - run: python -m pytest tests/test_site.py -v
