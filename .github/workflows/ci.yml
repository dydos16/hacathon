name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      # Сквозной тест «пакет → чистый venv → запуск» с установкой numpy/pandas из PyPI
      REPRO_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Покрытие (fail_under = 100) считаем на одной конфигурации: на остальных часть веток для других ОС пропускается
      - run: python -m pytest -v ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && '--cov' || '' }}

  site:
    name: site in browser · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      REPRO_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,e2e]"
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - run: python -m pytest tests/test_site.py -v
